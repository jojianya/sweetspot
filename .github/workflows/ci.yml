name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  client:
    name: Client (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Must run before Type-check, and on a cold .next. The app declares
      # `RootLayout({ children }: LayoutProps<"/">)` in src/app/layout.tsx;
      # LayoutProps is a global that Next generates into .next/types/, which is
      # gitignored (client/.gitignore: /.next/) and therefore absent on a fresh
      # checkout. Type-checking first fails with
      #   src/app/layout.tsx(25,50): error TS2304: Cannot find name 'LayoutProps'.
      # which is why this job was red on every push while the same command
      # passed locally: a warm local .next carries the generated types.
      #
      # `next typegen` emits exactly those definitions without a full build, so
      # it is cheaper than promoting the Build step above this one and keeps the
      # type error reporting a type error rather than a build failure.
      - name: Generate route types
        run: pnpm next typegen

      - name: Type-check
        run: pnpm tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        # No SITE_URL, NEXT_PUBLIC_API_URL, API_INTERNAL_URL or
        # NEXT_ALLOWED_DEV_ORIGINS: a build has to succeed with the optional
        # configuration unset. The client defaults each of them.
        run: pnpm build

  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: goodspotdb
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('server/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      # github.com/h2non/bimg is a cgo binding, so `go build` shells out to
      # pkg-config looking for vips.pc. The runner image has no libvips, so the
      # build died with:
      #   # [pkg-config --cflags -- vips vips vips]
      #   Package vips was not found in the pkg-config search path.
      # and the job never reached the tests. deployments/docker/server.Dockerfile.dev
      # already installs the Alpine equivalent (`vips-dev`); this is the Debian
      # package that provides the same vips.pc. build-essential is normally
      # preinstalled on the runner, but naming it keeps the step self-contained
      # if that ever changes.
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvips-dev \
            pkg-config \
            build-essential

      - name: Build
        run: go build ./...

      - name: Test (with race detector)
        # Deliberately no database credentials: the DB-backed tests skip rather
        # than run against the service containers, which have no schema yet.
        # TestMigrationUpDownUp covers the migrations against PostGIS below.
        run: go test ./... -race -count=1

      - name: Test migrations (up/down/up against PostGIS)
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASSWORD: testpass
          # The service container's database. It is created fresh for this run
          # and nothing else in this job uses it, which is what makes it safe to
          # let the migration test apply and roll back the real schema in it.
          MIGRATION_TEST_DB: goodspotdb
        run: go test ./internal/platform/database/ -run TestMigrationUpDownUp -count=1 -v

      - name: Test DB-backed endpoint tests (PostGIS)
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASSWORD: testpass
          # Separate disposable database on the same PostGIS service container.
          # The migration test above owns goodspotdb, so endpoint tests get
          # their own schema to avoid cross-package conflicts.
          ENDPOINT_TEST_DB: endpoint_test
          PGPASSWORD: testpass
        run: |
          psql -h localhost -U postgres -d goodspotdb -tc "SELECT 1 FROM pg_database WHERE datname='endpoint_test'" | grep -q 1 || psql -h localhost -U postgres -d goodspotdb -c 'CREATE DATABASE endpoint_test'
          go test ./internal/endpointtest/ -run 'TestDBDeletePin|TestDBPasswordReset|TestDBCollection' -race -count=1 -v

      - name: Vet
        run: go vet ./...