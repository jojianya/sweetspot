# PRODUCTION stack — single VM with nginx as the TLS terminator.
#
# Only the `proxy` service publishes ports (80/443). The app, API, Postgres
# and Redis share an internal bridge network and are not reachable from the
# internet directly. See docs/runbook.md for the deploy procedure.
#
# Required in .env (see .env.example): DOMAIN, POSTGRES_PASSWORD,
# REDIS_PASSWORD, JWT_SECRET, NEXT_PUBLIC_MAPTILER_API_KEY, STORAGE_BASE_URL
# (public https origin), SITE_URL (public https origin). Generate Postgres
# TLS assets first: ./scripts/generate-db-certs.sh
#
# RPO note: storage is local disk on named volumes (documented host-loss RPO
# in docs/runbook.md). R2/durable object storage is deferred post-launch.

services:
  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: goodspot-nginx:latest
    container_name: goodspot-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/includes/security-headers.conf:/etc/nginx/includes/security-headers.conf:ro
      - ./nginx/docker-entrypoint.d/30-bootstrap-certs.sh:/docker-entrypoint.d/30-bootstrap-certs.sh:ro
      - nginx_certs:/etc/nginx/certs
      - acme_webroot:/var/www/certbot:ro
    networks:
      - app_net
    depends_on:
      client:
        condition: service_healthy

  certbot:
    image: certbot/certbot:v4.1.1@sha256:263fe7ee9dde6440bf8baa957c0a8eb0118fc05ef86cf743c4cc84ca84303a21
    container_name: goodspot-certbot
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      CERTBOT_STAGING: ${CERTBOT_STAGING:-}
      CERTBOT_SERVER: ${CERTBOT_SERVER:-}
      CERTBOT_NO_VERIFY_SSL: ${CERTBOT_NO_VERIFY_SSL:-}
    # Shares the PID namespace with the nginx container so the renewal deploy
    # hook can SIGHUP the nginx master after installing a fresh certificate.
    pid: "service:proxy"
    entrypoint: /usr/local/bin/entrypoint.sh
    volumes:
      - certbot_data:/etc/letsencrypt
      - nginx_certs:/etc/nginx/certs
      - acme_webroot:/var/www/certbot
      - ./certbot/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./certbot/reload-nginx.sh:/usr/local/bin/reload-nginx.sh:ro
    networks:
      - app_net
    depends_on:
      - proxy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MAPTILER_API_KEY: ${NEXT_PUBLIC_MAPTILER_API_KEY:?set NEXT_PUBLIC_MAPTILER_API_KEY in .env}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${DOMAIN:?set DOMAIN in .env}}
        SITE_URL: ${SITE_URL:?set SITE_URL in .env}
        API_INTERNAL_URL: http://server:8081
    container_name: goodspot-client
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:?set SITE_URL in .env}
      API_INTERNAL_URL: http://server:8081
      # Docker sets HOSTNAME to the container id and Next's standalone server
      # would bind only to that address, making the /healthcheck fail and the
      # server unreachable as client:3000. Force the listen address.
      HOSTNAME: 0.0.0.0
    networks:
      - app_net
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: deployments/docker/server.Dockerfile
    container_name: goodspot-server
    restart: unless-stopped
    # No published ports: reachable only via the internal network.
    environment:
      PORT: 8081
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DB_NAME: goodspotdb
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-require}
      DB_POOL_MAX_CONNS: ${DB_POOL_MAX_CONNS:-10}
      DB_POOL_MAX_LIFETIME: ${DB_POOL_MAX_LIFETIME:-30m}
      DB_POOL_MAX_IDLE: ${DB_POOL_MAX_IDLE:-5m}
      DB_POOL_HEALTH_CHECK: ${DB_POOL_HEALTH_CHECK:-1m}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      STORAGE_BACKEND: local
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:?set STORAGE_BASE_URL in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENV: ${SENTRY_ENV:-production}
      MAX_SSE_CONNECTIONS: ${MAX_SSE_CONNECTIONS:-1000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${DOMAIN:?set DOMAIN in .env}}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-strict}
      # Production requires these to be set in .env (see .env.example):
      #   PUBLIC_BASE_URL=https://yourdomain.com
      #   MAILER_WEBHOOK_URL=https://your-mailer-webhook
      #   MAILER_WEBHOOK_KEY=your-secret-key
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      MAILER_WEBHOOK_URL: ${MAILER_WEBHOOK_URL:-}
      MAILER_WEBHOOK_KEY: ${MAILER_WEBHOOK_KEY:-}
      # Set this to true for the first deploy after upgrading to quarantined
      # hidden pins: the sweep logs checked/moved counts without moving files.
      QUARANTINE_SWEEP_DRY_RUN: ${QUARANTINE_SWEEP_DRY_RUN:-false}
      # Trust only this compose network for X-Forwarded-* headers. The Next
      # rewrite does not forward X-Forwarded-For yet, so per-IP rate limits
      # remain shared per proxy until that changes (see docs/SECURITY.md).
      TRUSTED_PROXIES: 10.89.0.0/24
      GOGC: "50"
      GOMEMLIMIT: 2GiB
    healthcheck:
      # Readiness: wait for Postgres/Redis before dependents proceed. Restarts
      # key off liveness (/health in the image HEALTHCHECK), so a Redis blip
      # never restarts a healthy process.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/ready || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    volumes:
      - server_uploads:/app/uploads
      - quarantine_data:/app/quarantine
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgis/postgis:16-3.4
    container_name: goodspot-postgres
    restart: unless-stopped
    # No published ports: reachable only via the internal network.
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/run/secrets/db.crt
      -c ssl_key_file=/run/secrets/db.key
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: goodspotdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./secrets/db/server.crt:/run/secrets/db.crt:ro
      - ./secrets/db/server.key:/run/secrets/db.key:ro
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: goodspot-redis
    restart: unless-stopped
    # No published ports: reachable only via the internal network.
    # No volume: Redis holds only the JWT blacklist (revocations) and the
    # realtime pub/sub bus. A restart loses logged-out-token revocations until
    # those JWTs expire — accepted and documented in docs/runbook.md.
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli -h 127.0.0.1 ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app_net:
    ipam:
      config:
        - subnet: 10.89.0.0/24

volumes:
  postgres_data:
  server_uploads:
  quarantine_data:
  nginx_certs:
  certbot_data:
  acme_webroot:
