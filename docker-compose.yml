# LOCAL DEVELOPMENT stack — hot reload with bind mounts (no rebuilds needed).
#
# Quick start:
#   cp .env.example .env          (first time)
#   docker compose up -d --build  (only needed when a Dockerfile or lockfile changes)
#   docker compose up -d          (everything after: bind mounts pick up edits live)
#
# How hot reload works:
#   - client: `./client` is bind-mounted; `next dev` (HMR) replays changes instantly.
#   - server: `./server` is bind-mounted; Air rebuilds + restarts the Go binary on save.
#   - node_modules / .next live in anonymous volumes so container deps aren't clobbered.
#   Rebuild the images only when you touch a Dockerfile, package.json, or go.mod.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: goodspotdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: goodspotdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    container_name: goodspot247-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  server:
    # Distinct tag: docker-compose.prod.yml builds ./server with
    # server.Dockerfile into the implicit `<project>-server` image. Sharing a
    # tag let a prod build overwrite this dev image; `up -d` (no --build) then
    # reused it and ran the prod `CMD ["./server"]`, which is absent under the
    # ./server:/app bind mount ("exec: \"./server\": no such file or directory").
    image: sweetspot-server-dev
    build:
      context: ./server
      dockerfile: deployments/docker/server.Dockerfile.dev
    container_name: goodspot247-server
    restart: unless-stopped
    ports:
      - "0.0.0.0:8081:8081"
    environment:
      PORT: 8081
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DB_NAME: goodspotdb
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      STORAGE_BACKEND: local
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:-http://localhost:8081}
      LOG_LEVEL: debug
      LOG_FORMAT: ${LOG_FORMAT:-text}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENV: ${SENTRY_ENV:-development}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      MAILER_WEBHOOK_URL: ${MAILER_WEBHOOK_URL:-}
      MAILER_WEBHOOK_KEY: ${MAILER_WEBHOOK_KEY:-}
      QUARANTINE_SWEEP_DRY_RUN: ${QUARANTINE_SWEEP_DRY_RUN:-false}
      # Trust only this compose network for X-Forwarded-* headers. nginx
      # proxies /api/*, /events and /uploads/* straight to Go and overwrites
      # X-Forwarded-For with the real peer, so per-IP rate limits see the
      # real client. A CIDR is the narrowest static value: container IPs are
      # assigned dynamically, so a single IP cannot be pinned. Never widen to
      # 0.0.0.0/0 (the Go server rejects it at startup).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-10.90.0.0/24}
      DB_POOL_MAX_CONNS: ${DB_POOL_MAX_CONNS:-10}
      DB_POOL_MAX_LIFETIME: ${DB_POOL_MAX_LIFETIME:-30m}
      DB_POOL_MAX_IDLE: ${DB_POOL_MAX_IDLE:-5m}
      DB_POOL_HEALTH_CHECK: ${DB_POOL_HEALTH_CHECK:-1m}
      MAX_SSE_CONNECTIONS: ${MAX_SSE_CONNECTIONS:-1000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://goodspot.test:8443}
      # strict (default) is CSRF-safe but is NOT sent when the browser reaches
      # the app over plain HTTP on a LAN origin, so the session cookie is
      # dropped and the phone appears logged out. Set COOKIE_SAMESITE=lax in .env
      # when testing from another device; leave it strict for HTTPS deployments.
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-strict}
      # This box is RAM-constrained; cap the Go toolchain so builds don't OOM.
      GOGC: "50"
      GOMEMLIMIT: 2GiB
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    volumes:
      - ./server:/app
      - server_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net

  client:
    # See the server note above: keep the dev image out of the implicit
    # `<project>-client` tag that docker-compose.prod.yml builds into.
    image: sweetspot-client-dev
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: goodspot247-client
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      NEXT_PUBLIC_MAPTILER_API_KEY: ${NEXT_PUBLIC_MAPTILER_API_KEY:?set NEXT_PUBLIC_MAPTILER_API_KEY in .env}
      # Not the browser's API origin any more: next.config.ts rewrites /api/* to
      # the Go server so the browser stays same-origin. This value is still read
      # for SSR metadata (lib/site.ts) and as the SSR fetch fallback.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      # Server-side address of the API, for SSR fetches (pin pages) and as the
      # /api/* rewrite destination. Must be the compose service name, not the
      # published loopback port, because inside this container localhost is the
      # container itself.
      API_INTERNAL_URL: http://server:8081
      # Extra origins allowed to hit the dev server (HMR WebSocket) from a LAN
      # address or via the dev nginx proxy. Unset falls back to
      # localhost,127.0.0.1,goodspot.test.
      NEXT_ALLOWED_DEV_ORIGINS: ${NEXT_ALLOWED_DEV_ORIGINS:-localhost,127.0.0.1,goodspot.test}
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - server
    networks:
      - app_net

  nginx:
    # Dev edge proxy, mirroring production TLS termination locally. Separate
    # container built from ./nginx; no certbot sidecar (the entrypoint
    # bootstrap script mints a self-signed cert for DOMAIN on first boot).
    # Always in the stack: no profile. Uses its own cert volume so the
    # self-signed dev cert never touches prod's nginx_certs.
    build:
      context: ./nginx
    image: sweetspot-nginx-dev
    container_name: goodspot247-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      DOMAIN: goodspot.test
    volumes:
      - ./nginx/dev.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/includes/security-headers.conf:/etc/nginx/includes/security-headers.conf:ro
      - ./nginx/docker-entrypoint.d/30-bootstrap-certs.sh:/docker-entrypoint.d/30-bootstrap-certs.sh:ro
      - nginx_certs_dev:/etc/nginx/certs
    depends_on:
      - client
    networks:
      - app_net

volumes:
  postgres_data:
  server_uploads:
  nginx_certs_dev:

networks:
  app_net:
    ipam:
      config:
        - subnet: 10.90.0.0/24