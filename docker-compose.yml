version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: goodspotdb-postgres
    restart: unless-stopped
    environment:
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DB_NAME: goodspotdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: goodspot247-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: goodspot247-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DB_NAME: goodspotdb
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      STORAGE_BACKEND: local
      STORAGE_BASE_URL: http://localhost:8081
      LOG_LEVEL: info
      LOG_FORMAT: text
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENV: ${SENTRY_ENV:-development}
    volumes:
      - ./server:/app
      - /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: goodspot247-client
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_MAPTILER_API_KEY: "${NEXT_PUBLIC_MAPTILER_API_KEY:?set NEXT_PUBLIC_MAPTILER_API_KEY in .env}"
      NEXT_PUBLIC_TILES_URL: "http://localhost:8080"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      API_INTERNAL_URL: http://server:8081
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - server

  tiles:
    image: maptiler/tileserver-gl:latest
    container_name: goodspot247-tiles
    restart: unless-stopped
    command: ["--config", "/data/config.json", "--port", "8080", "--bind", "0.0.0.0"]
    volumes:
      - ${TILES_DIR:-.}/philippines.mbtiles:/data/philippines.mbtiles:ro
      - ${TILES_DIR:-.}/style:/data/styles/goodspot:ro
      - ${TILES_DIR:-.}/sprites:/data/sprites:ro
      - ${TILES_DIR:-.}/tileserver-config.json:/data/config.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8080/styles/goodspot/style.json',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  server_uploads:
