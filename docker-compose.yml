# LOCAL DEVELOPMENT stack — hot reload with bind mounts (no rebuilds needed).
#
# Quick start:
#   cp .env.example .env          (first time)
#   docker compose up -d --build  (only needed when a Dockerfile or lockfile changes)
#   docker compose up -d          (everything after: bind mounts pick up edits live)
#
# How hot reload works:
#   - client: `./client` is bind-mounted; `next dev` (HMR) replays changes instantly.
#   - server: `./server` is bind-mounted; Air rebuilds + restarts the Go binary on save.
#   - node_modules / .next live in anonymous volumes so container deps aren't clobbered.
#   Rebuild the images only when you touch a Dockerfile, package.json, or go.mod.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: goodspotdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: goodspotdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: goodspot247-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: deployments/docker/server.Dockerfile.dev
    container_name: goodspot247-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DB_NAME: goodspotdb
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      STORAGE_BACKEND: local
      STORAGE_BASE_URL: http://localhost:8081
      LOG_LEVEL: debug
      # This box is RAM-constrained; cap the Go toolchain so builds don't OOM.
      GOGC: "50"
      GOMEMLIMIT: 2GiB
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    volumes:
      - ./server:/app
      - server_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: goodspot247-client
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_MAPTILER_API_KEY: ${NEXT_PUBLIC_MAPTILER_API_KEY:?set NEXT_PUBLIC_MAPTILER_API_KEY in .env}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - server

volumes:
  postgres_data:
  server_uploads: