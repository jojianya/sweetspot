# Security headers for the HTTPS server. Must be repeated in EVERY location
# that sets its own add_header: add_header in a location block replaces all
# add_header directives inherited from the server block. Keeping them in one
# include avoids drift.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
