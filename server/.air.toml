root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -p 1 -o ./tmp/server ./cmd/api"
  entrypoint = "./tmp/server"
  include_ext = ["go"]
  exclude_dir = ["tmp", "uploads", ".git"]
  include_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  kill_delay = 500
  delay = 300
  stop_on_error = true
  send_interrupt = true
  log_time = true

[log]
  time = true

[misc]
  clean_on_exit = true